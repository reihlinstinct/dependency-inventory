name: Vulnerability scan (reusable)

on:
  workflow_call:

# No top-level or scan-job permissions block: called-workflow jobs inherit
# the caller job's grants (a called workflow can downgrade, never elevate).
# Callers grant contents:read everywhere; the weekly inventory is published
# as a workflow artifact, never committed, so no caller needs write access.

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch depinv tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: reihlinstinct/dependency-inventory
          ref: v1
          path: .depinv
          persist-credentials: false
      - name: Generate inventory
        run: python3 .depinv/tools/generate_inventory.py --repo . --name "$GITHUB_REPOSITORY" --out deps-inventory.json
      - name: Scan against OSV
        run: python3 .depinv/tools/scan_inventory.py --inventory deps-inventory.json --out vuln-report.md --title "Vulnerability scan - $GITHUB_REPOSITORY"
      - name: Publish inventory artifact
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-inventory
          path: |
            deps-inventory.json
            vuln-report.md
          retention-days: 30
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
