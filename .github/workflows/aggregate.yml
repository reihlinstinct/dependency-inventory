name: Aggregate inventory

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Collect and scan
        env:
          REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/aggregate.py
      - name: Commit data
        run: |
          git config user.name "depinv-bot"
          git config user.email "depinv-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: weekly inventory aggregation"
            git push
          fi
